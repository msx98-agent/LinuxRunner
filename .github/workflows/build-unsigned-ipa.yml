name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      GPU_DEPS: ${{ github.workspace }}/build/gpu-sources
      DEPOT_TOOLS_UPDATE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Use selected Xcode in all build scripts
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Initialize pinned dependencies
        run: git submodule update --init --recursive --checkout -- deps/libapps deps/libarchive deps/glslang deps/spirv-cross
      - name: Identify Xcode toolchain
        id: xcode
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Identify pinned StikJIT revision
        id: stikjit-revision
        run: echo "sha=$(git rev-parse HEAD:deps/StikJIT)" >> "$GITHUB_OUTPUT"
      - name: Restore compiled StikJIT framework
        id: stikjit-cache
        uses: actions/cache/restore@v4
        with:
          path: build/StikJIT.framework
          key: stikjit-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ steps.stikjit-revision.outputs.sha }}-${{ hashFiles('scripts/build-stikjit.sh') }}
      - name: Restore pinned Metal libraries
        id: metal-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/gpu/iphoneos/lib
            build/gpu/iphoneos/include
            build/gpu/iphoneos/REVISIONS
          key: metal-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('scripts/build-gpu-deps.sh', 'scripts/prepare-gpu-deps.sh', 'scripts/gpu/**') }}
      - name: Restore compiled ANGLE
        id: angle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/gpu/iphoneos/lib/libangle.a
            build/gpu/iphoneos/include/angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('scripts/prepare-gpu-deps.sh', 'scripts/gpu/angle*.py') }}
      - name: Install missing build tools
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          STIKJIT_CACHE_HIT: ${{ steps.stikjit-cache.outputs.cache-hit }}
        run: |
          echo 'build-unsigned-ipa:tools: checking build prerequisites'
          missing=()
          command -v meson >/dev/null || missing+=(meson)
          command -v ninja >/dev/null || missing+=(ninja)
          command -v cmake >/dev/null || missing+=(cmake)
          command -v pkg-config >/dev/null || missing+=(pkgconf)
          lld_bin="$(brew --prefix)/opt/lld/bin"
          command -v ld.lld >/dev/null || [[ -x "$lld_bin/ld.lld" ]] || missing+=(lld)
          [[ "$STIKJIT_CACHE_HIT" == true ]] || command -v xcodegen >/dev/null || missing+=(xcodegen)
          echo "build-unsigned-ipa:tools: missing Homebrew packages: ${missing[*]:-none}"
          if ((${#missing[@]})); then
            brew install "${missing[@]}"
            echo 'build-unsigned-ipa:tools: Homebrew install succeeded'
          fi
          if ! command -v ld.lld >/dev/null; then
            echo 'build-unsigned-ipa:tools: checking the Homebrew linker'
            if [[ ! -x "$lld_bin/ld.lld" ]]; then
              echo "build-unsigned-ipa:tools: error, ld.lld not found at $lld_bin/ld.lld" >&2
              exit 1
            fi
            echo "$lld_bin" >> "$GITHUB_PATH"
            echo 'build-unsigned-ipa:tools: Homebrew linker added to PATH for later steps'
          fi
          python3 -m venv "$RUNNER_TEMP/linuxrunner-python"
          "$RUNNER_TEMP/linuxrunner-python/bin/python" -m pip install mako PyYAML
          echo "$RUNNER_TEMP/linuxrunner-python/bin" >> "$GITHUB_PATH"
          echo 'build-unsigned-ipa:tools: all prerequisites ready'
      - name: Prepare pinned Metal sources
        if: steps.metal-cache.outputs.cache-hit != 'true'
        run: scripts/prepare-gpu-deps.sh
      - name: Build Metal libraries
        if: steps.metal-cache.outputs.cache-hit != 'true'
        env:
          ANGLE_PREBUILT: ${{ steps.angle-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: scripts/build-gpu-deps.sh iphoneos
      - name: Save compiled ANGLE
        if: always() && steps.angle-cache.outputs.cache-hit != 'true' && hashFiles('build/gpu/iphoneos/lib/libangle.a') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/gpu/iphoneos/lib/libangle.a
            build/gpu/iphoneos/include/angle
          key: ${{ steps.angle-cache.outputs.cache-primary-key }}
      - name: Save pinned Metal libraries
        if: steps.metal-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/gpu/iphoneos/lib
            build/gpu/iphoneos/include
            build/gpu/iphoneos/REVISIONS
          key: ${{ steps.metal-cache.outputs.cache-primary-key }}
      - name: Build pinned StikJIT framework
        if: steps.stikjit-cache.outputs.cache-hit != 'true'
        run: scripts/build-stikjit.sh
      - name: Save compiled StikJIT framework
        if: steps.stikjit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/StikJIT.framework
          key: ${{ steps.stikjit-cache.outputs.cache-primary-key }}
      - name: Build unsigned JIT-capable IPA
        env:
          LINUXRUNNER_JIT: 'YES'
          LINUXRUNNER_VIRGL: 'YES'
        run: scripts/build-ipa.sh --unsigned
      - name: Verify JIT and Metal artifact
        env:
          LINUXRUNNER_JIT: 'YES'
          LINUXRUNNER_VIRGL: 'YES'
          LINUXRUNNER_VERIFY_SOURCE_TREE: ${{ github.workspace }}
          LINUXRUNNER_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/verify-ipa.py build/releases
      - name: Verify embedded JIT helper
        run: python3 scripts/check-stikjit-ipa.py build/releases/LinuxRunner.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LinuxRunner-unsigned-IPA
          path: |
            build/releases/*.ipa
            build/releases/*.sha256
            build/releases/*.json
            build/releases/*STATUS.txt
            build/releases/source-revision.txt
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LinuxRunner-build-logs
          path: |
            build/releases/*.log
            build/gpu/iphoneos/work/**/meson-logs/*.txt
          if-no-files-found: ignore
